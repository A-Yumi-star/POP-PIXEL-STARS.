<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Pixel Stars: Tour of Legends</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #1b0c2e 0%, #05030a 100%);
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    #game-container {
      position: relative;
      border: 4px solid #ff007f;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(255, 0, 127, 0.45);
      background: #000;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      width: 100%;
      max-width: 800px;
      height: auto;
      aspect-ratio: 16 / 9;
    }
    #nick-modal {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 10, 28, 0.95);
      border: 2px solid #00ffff;
      padding: 20px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    input {
      background: #080414;
      border: 1px solid #ff007f;
      color: #fff;
      padding: 6px;
      text-align: center;
      text-transform: uppercase;
    }
    button {
      background: #ff007f;
      color: #fff;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .instructions { margin-top: 10px; font-size: 12px; color: #aaa; text-align: center; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="384" height="216"></canvas>

    <div id="nick-modal">
      <h3 style="color: #00ffff; font-size: 12px;">IDENTIFICAÇÃO</h3>
      <input type="text" id="nickname-input" maxlength="10" placeholder="SEU NICK" autocomplete="off" />
      <button id="confirm-nick-btn">JOGAR</button>
    </div>
  </div>

  <div class="instructions">
    Mover: <b>A / D ou Seta Esquerda/Direita</b> | Pular: <b>ESPAÇO / W / Seta Cima</b>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const modal = document.getElementById('nick-modal');
const input = document.getElementById('nickname-input');
const btn = document.getElementById('confirm-nick-btn');

let nick = localStorage.getItem('pop_pixel_nick') || '';

if (nick) {
  modal.style.display = 'none';
} else {
  modal.style.display = 'flex';
}

btn.addEventListener('click', () => {
  if (input.value.trim().length > 0) {
    nick = input.value.trim().toUpperCase();
    localStorage.setItem('pop_pixel_nick', nick);
    modal.style.display = 'none';
  }
});

// Dados do Jogador
const player = {
  x: 50,
  y: 150,
  w: 12,
  h: 16,
  vx: 0,
  vy: 0,
  speed: 2,
  jumpPower: -5.5,
  gravity: 0.25,
  grounded: false
};

const keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function update() {
  // Controles
  if (keys['ArrowRight'] || keys['KeyD']) player.vx = player.speed;
  else if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -player.speed;
  else player.vx = 0;

  if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
  }

  // Gravidade e Movimento
  player.vy += player.gravity;
  player.x += player.vx;
  player.y += player.vy;

  // Colisão com o Chão (Y = 170)
  if (player.y + player.h >= 170) {
    player.y = 170 - player.h;
    player.vy = 0;
    player.grounded = true;
  }

  // Limites da Tela
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
}

function render() {
  // Fundo
  ctx.fillStyle = '#1b0c2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Chão
  ctx.fillStyle = '#b45309';
  ctx.fillRect(0, 170, canvas.width, 46);

  // Jogador (Quadrado Rosa)
  ctx.fillStyle = '#ff007f';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // HUD / Nickname
  ctx.fillStyle = '#00ffff';
  ctx.font = '10px monospace';
  ctx.fillText('JOGADOR: ' + (nick || 'ANÔNIMO'), 10, 15);
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
