// 1. PERSISTÊNCIA SEGURA (COM FALLBACK EM MEMÓRIA PARA GITHUB PAGES)

const STORAGE_NICK_KEY = 'pop_pixel_gh_nick';
const STORAGE_BOARD_KEY = 'pop_pixel_gh_board';

const memoryStorage = {};
function safeGet(key) {
  try {
    return window.localStorage ? window.localStorage.getItem(key) : memoryStorage[key];
  } catch (e) {
    return memoryStorage[key] || null;
  }
}
function safeSet(key, value) {
  try {
    if (window.localStorage) window.localStorage.setItem(key, value);
    else memoryStorage[key] = value;
  } catch (e) {
    memoryStorage[key] = value;
  }
}

let currentUser = safeGet(STORAGE_NICK_KEY) || null;

function getRegisteredUsers() {
  const data = safeGet(STORAGE_BOARD_KEY);
  try {
    return data ? JSON.parse(data) : [];
  } catch (e) {
    return [];
  }
}

function saveUserRecord(nick, scoreToAdd, stars) {
  let board = getRegisteredUsers();
  let user = board.find(u => u.nick === nick);
  if (!user) {
    user = { nick, score: 0, stars: 0 };
    board.push(user);
  }
  user.score += scoreToAdd;
  user.stars += stars;
  board.sort((a, b) => b.score - a.score);
  safeSet(STORAGE_BOARD_KEY, JSON.stringify(board));
}

// 2. MOTOR DE ÁUDIO CHIPTUNE NATIVO
// ============================================================================
let audioCtx = null;
let masterGain = null;
let masterVolume = 0.5;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function setVolume(v) {
  masterVolume = Math.max(0, Math.min(1, v));
  if (masterGain && audioCtx) {
    masterGain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
  }
}

function m2f(m) {
  return (!m || m <= 0) ? 0 : 440 * Math.pow(2, (m - 69) / 12);
}

class ChiptuneTracker {
  constructor() {
    this.timer = null;
    this.step = 0;
    this.track = null;
  }
  play(track) {
    this.stop();
    this.track = track;
    this.step = 0;
    const ctx = getAudioContext();
    const stepDuration = (60 / track.bpm) / 4;

    this.timer = setInterval(() => {
      if (!this.track) return;
      const now = ctx.currentTime;
      const l = this.track.lead[this.step % this.track.lead.length];
      if (l > 0) this.tone(m2f(l), 'square', stepDuration * 0.85, 0.12, now);
      const b = this.track.bass[this.step % this.track.bass.length];
      if (b > 0) this.tone(m2f(b), 'triangle', stepDuration * 0.9, 0.22, now);
      if (this.track.drums && this.track.drums[this.step % this.track.drums.length]) {
        this.noise(0.04, 0.08, now);
      }
      this.step++;
    }, stepDuration * 1000);
  }
  stop() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.track = null;
  }
  tone(freq, type, duration, vol, time) {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, time);
      g.gain.setValueAtTime(vol, time);
      g.gain.exponentialRampToValueAtTime(0.0001, time + duration);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(time);
      osc.stop(time + duration);
    } catch(e){}
  }
  noise(duration, vol, time) {
    try {
      const ctx = getAudioContext();
      const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + duration);
      src.connect(g);
      g.connect(masterGain);
      src.start(time);
    } catch(e){}
  }
  sfxJump() { this.tone(180, 'square', 0.12, 0.15, getAudioContext().currentTime); }
  sfxCoin() {
    const t = getAudioContext().currentTime;
    this.tone(987, 'sine', 0.08, 0.18, t);
    this.tone(1318, 'sine', 0.18, 0.18, t + 0.07);
  }
  sfxStar() {
    const t = getAudioContext().currentTime;
    [659, 830, 987, 1318].forEach((f, i) => this.tone(f, 'sine', 0.1, 0.2, t + i * 0.06));
  }
  sfxHit() { this.tone(140, 'sawtooth', 0.15, 0.25, getAudioContext().currentTime); }
  sfxSwitch() {
    const t = getAudioContext().currentTime;
    this.tone(440, 'triangle', 0.08, 0.2, t);
    this.tone(880, 'square', 0.14, 0.2, t + 0.08);
  }
}

  '.': null,
  'K': '#05030a',
  'W': '#ffffff',
  'S': '#ffd8b3',
  'T': '#99582a',
  'R': '#ef233c',

  'N': '#00ffff'
};

function drawSprite(ctx, x, y, matrix, flip = false) {
  const h = matrix.length;
  const w = matrix[0].length;

  ctx.fillStyle = "#000000";
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      if (matrix[r][c] !== '.') {
        const px = flip ? x + (w - 1 - c) : x + c;
        const py = y + r;
        ctx.fillRect(px - 1, py, 3, 1);
        ctx.fillRect(px, py - 1, 1, 3);
      }
    }
  }

  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      const color = PALETTE[matrix[r][c]];
      if (color) {
        ctx.fillStyle = color;
        const px = flip ? x + (w - 1 - c) : x + c;
        const py = y + r;
        ctx.fillRect(Math.floor(px), Math.floor(py), 1, 1);
      }
    }
  }
}
